[functions.create-order]
verify_jwt = true

# Payment providers call this endpoint without a Supabase user JWT.
# The function authenticates every request using its timestamped HMAC signature.
[functions.payment-webhook]
verify_jwt = false

# Internal worker authenticates with a dedicated secret header.
[functions.provision-worker]
verify_jwt = false

# Token authentication verifies the publishable API key and access token in the function itself.
[functions.token-auth]
verify_jwt = false

# Customer cancellation requires a valid Supabase user JWT.
[functions.cancel-order]
verify_jwt = true
