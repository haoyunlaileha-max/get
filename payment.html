<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>充值付款 — Anonymous Hosting</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/site.css"></head>
<body class="account-page">
<header><div class="wrap nav"><a class="brand" href="index.html"><img class="brand-mark" src="assets/brand-mark.svg" alt=""><span>ANONYMOUS <b>HOSTING</b></span></a><div class="account-nav"><a class="btn btn-ghost" href="account.html#balance">返回账户</a></div></div></header>
<main class="account-wrap topup-payment-wrap"><section class="account-card topup-payment-shell">
<div id="payment-error" class="account-error" role="alert" hidden></div>
<div id="payment-content" class="topup-payment-page">
<section class="topup-payment-summary"><h2>充值余额</h2><div class="topup-payment-summary-card">
<div class="topup-payment-summary-banner"><span class="topup-payment-mark">＋</span><div><strong id="payment-summary-title">向您的账户充值</strong><small>链上交易确认后，余额即时到账。</small></div></div>
<div class="topup-payment-line"><span>您的付款金额</span><strong id="payment-usdt-amount">—</strong></div><div class="topup-payment-line bonus"><span>＋ 奖励</span><strong id="payment-bonus">—</strong></div><div class="topup-payment-line"><span>您将获得</span><strong id="payment-total">—</strong></div><div class="topup-payment-line"><span>到期时间</span><strong>余额无有效期</strong></div></div>
<div class="topup-payment-grand-total"><span>合计</span><strong id="payment-total-due">—</strong></div><p class="topup-payment-order" id="payment-order-id"></p></section>
<aside class="topup-payment-card"><div class="topup-payment-card-head"><strong id="payment-method">加密货币付款</strong><strong id="payment-countdown" class="topup-payment-countdown">—</strong></div>
<div class="topup-qr-wrap" id="payment-qr-wrap"><img id="payment-qr" class="topup-qr-image" alt="收款地址二维码" width="180" height="180"></div>
<div class="topup-payment-field"><small>准确发送</small><div class="topup-payment-copy-row"><code id="payment-amount">—</code><button id="copy-payment-amount" type="button">复制</button></div></div>
<div class="topup-payment-field"><small>收款地址</small><div class="topup-payment-copy-row"><code id="payment-address">—</code><button id="copy-payment-address" type="button">复制</button></div></div>
<div id="payment-state" class="topup-payment-waiting" role="status">● 等待付款…</div><p class="topup-payment-warning">请务必使用指定网络，并支付上方显示的精确金额。转错网络、少付或过期转账可能需要人工核验。</p>
<button id="cancel-payment-order" class="btn btn-ghost topup-payment-cancel" type="button">取消订单</button></aside></div></section></main>
<script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-auth-bootstrap.js"></script><script type="module" src="assets/js/topup-payment.js"></script></body></html>
